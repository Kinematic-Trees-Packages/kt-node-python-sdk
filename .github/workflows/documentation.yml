name: Python SDK documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,docs]'
      - run: scripts/docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kt-node-python-sdk-docs-v0.2
          path: build/docs-artifacts/kt-node-python-sdk-docs-v0.2.tar.gz
          if-no-files-found: error

  accessibility:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[test,docs]'
      - run: scripts/docs.sh
      - run: npm install --no-save --no-package-lock @axe-core/playwright@4.10.2 playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - run: scripts/accessibility.sh

  quick-start:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://app.kinematictrees.com/api/v2/registry/install.sh | sh
      - run: KTM_BIN="$HOME/.ktrees/bin/ktm" scripts/docs_quickstart_smoke.sh
