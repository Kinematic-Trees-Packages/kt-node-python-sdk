site_name: KT Node Python SDK
site_description: Build portable Kinematic Trees processes with Python and the frozen KT Node ABI.
site_url: https://docs.kinematictrees.com/python/v0.2/
docs_dir: docs/site
site_dir: build/docs/v0.2
strict: true

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/kt-mark.svg
  favicon: assets/kt-mark.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    scheme: slate
    primary: black
    accent: cyan

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: v0.2

copyright: Copyright &copy; 2026 Kinematic Trees

nav:
  - Home: index.md
  - Getting started:
      - Install KTM: getting-started/install-ktm.md
      - Install the runtime and SDK: getting-started/install-runtime-sdk.md
      - Create a project: getting-started/create-project.md
      - Run and test locally: getting-started/run-local.md
  - Concepts:
      - Runtime and process model: concepts/runtime-process.md
      - Lifecycle and ownership: concepts/lifecycle-ownership.md
      - Channels and configuration: concepts/channels-configuration.md
      - Data models: concepts/data-models.md
      - Transports: concepts/transports.md
  - Guides:
      - Build a process: guides/build-process.md
      - Errors and shutdown: guides/errors-shutdown.md
      - Package with KTM: guides/package-ktm.md
      - Publish and deploy: guides/publish-deploy.md
  - Examples:
      - Minimal process: examples/minimal-process.md
      - HTTP relay: examples/http-relay.md
      - Summer reference package: examples/summer.md
  - API reference: reference/api.md
  - Compatibility: compatibility.md
  - Troubleshooting: troubleshooting.md
  - Release notes: release-notes.md
