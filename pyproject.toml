[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-node-python-sdk"
version = "0.2.0"
description = "Python bindings for the frozen KT Node C ABI"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"

[project.optional-dependencies]
vision = ["flatbuffers>=24.3.25", "numpy>=1.24"]
test = ["flatbuffers>=24.3.25", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ktnode"]

[[tool.mypy.overrides]]
module = "ktnode.runtime"
disable_error_code = ["valid-type", "assignment", "no-any-return"]

[tool.ruff]
target-version = "py39"
line-length = 140
exclude = ["python/ktnode/generated"]

[tool.ruff.lint]
ignore = ["BLE001", "PYI034", "S110", "UP037"]
