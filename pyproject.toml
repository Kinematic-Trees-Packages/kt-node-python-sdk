[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-python-sdk"
version = "0.2.0"
description = "Python bindings for the frozen KT Node C ABI"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"

[project.optional-dependencies]
vision = ["numpy>=1.24"]
test = [
  "coverage[toml]==7.10.7",
  "flatbuffers==24.12.23",
  "mypy==1.18.2",
  "numpy>=1.24",
  "pytest==8.3.5",
  "ruff==0.11.13",
]
docs = [
  "beautifulsoup4==4.12.3",
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.14",
  "mkdocstrings[python]==0.29.1",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ktnode"]
omit = [
  # Private ctypes declarations are exercised by the native clean-room suite;
  # Python coverage measures the supported high-level SDK surface.
  "python/ktnode/abi.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.coverage.json]
output = "build/coverage/coverage.json"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ktnode"]

[[tool.mypy.overrides]]
module = "ktnode.runtime"
disable_error_code = ["valid-type", "assignment", "no-any-return"]

[[tool.mypy.overrides]]
module = "flatbuffers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kt_messages._flatbuffers.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
ignore = ["BLE001", "PYI034", "S110", "UP037"]
